[project]
name = "knowledge-ingestion-proxy"
version = "0.1.0"
description = "Document intake proxy: parse, redact, and push documents into Open WebUI knowledge bases"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    "charset-normalizer>=3.4",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
